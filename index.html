<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Coffe Clicker</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="game-tools">
        <button id="removercps">remover cps</button>
        <button id="btnprogresso">remover progresso (teste)</button>
    </div>

    <section class="stats" aria-label="Estatísticas">
        <p>Cafés <span id="contador">0</span></p>
        <p>Por segundo <span id="cps">0</span></p>
        <p>Poder de clique <span id="poderclique">0</span> </p>
    </section>

    <main class="game-layout">
        <section class="clicker-panel" aria-label="Área de clique">
            <p class="clicker-hint">Clique no café para produzir</p>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTUFI-KLazhHMZhVHknaYfstEUNOd0WkoBwqHk2Z9FTOESUA9bhWOnh37l&s=10" id="btncafe">
            <button id="btncafe2">clicar (teste)</button>
        </section>

        <section class="shop" aria-label="Loja">
            <h2>Loja</h2>
            <div class="shop-item">
                <button id="btnupgradeclique">Melhorar clique <span class="item-info">Custo: <span id="cupgradeclique">0</span></button>
            </div>

            <div class="shop-item">
                <button id="btncoador">Comprar Coador (custo: <span id="ccoador">10</span>) | QTD: <span id="qtdcoador">0</span></button>
            </div>

            <div class="shop-item">
                <button id="btnbarista">Comprar baristas (Custo <span id="cbarista">50</span>) | QTD <span id="qtdbarista">0</span></button>
            </div>

            <div class="shop-item">
                <button id="btnexpresso">Comprar expresso (Custo <span id="cexpresso">100</span>) | QTD <span id="qtdexpresso">0</span></button>
            </div>

             <div class="shop-item">
                <button id="btnbanco">Banco (Custo <span id="cbanco">50</span>) | QTD <span id="qtdbanco">0</span></button>
            </div>

            <div class="shop-item">
                <button id="btncafeteria">Cafeteria (Custo <span id="ccafeteria">50</span>) | QTD <span id="qtdcafeteria">0</span></button>
            </div>

            <div class="shop-item">
                <button id="btnfazenda">Fazenda de Café (Custo <span id="cfazenda">50</span>) | QTD <span id="qtdfazenda">0</span></button>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
